name: Bicep CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bicep CLI
        run: |
          az bicep install

      - name: Lint Bicep Files & Build ARM Templates
        id: bicep
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          head_sha="${{ github.sha }}"
          mkdir -p .ci

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            git ls-files -z '*.bicep' > .ci/changed-bicep
          else
            git diff --name-only --no-renames --diff-filter=ACDMR -z \
              "$base_sha" "$head_sha" -- '*.bicep' > .ci/changed-bicep
          fi

          python3 <<'PY' > .ci/affected-bicep
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          changed = {
              os.path.normpath(value.decode("utf-8"))
              for value in Path(".ci/changed-bicep").read_bytes().split(b"\0")
              if value
          }
          tracked = {
              value.decode("utf-8")
              for value in subprocess.check_output(
                  ["git", "ls-files", "-z", "*.bicep"]
              ).split(b"\0")
              if value
          }
          local_module = re.compile(r"(?m)^\s*module\s+\w+\s+'([^']+\.bicep)'")
          reverse_dependencies = {}

          for source in tracked:
              content = Path(source).read_text(encoding="utf-8")
              for reference in local_module.findall(content):
                  target = os.path.normpath(
                      os.path.join(os.path.dirname(source), reference)
                  )
                  reverse_dependencies.setdefault(target, set()).add(source)

          affected = set()
          pending = list(changed)
          visited = set(changed)
          while pending:
              dependency = pending.pop()
              if dependency in tracked:
                  affected.add(dependency)
              for caller in reverse_dependencies.get(dependency, set()):
                  if caller not in visited:
                      visited.add(caller)
                      pending.append(caller)

          payload = b"\0".join(path.encode("utf-8") for path in sorted(affected))
          if payload:
              payload += b"\0"
          sys.stdout.buffer.write(payload)
          PY

          mapfile -d '' bicep_files < .ci/affected-bicep
          if (( ${#bicep_files[@]} == 0 )); then
            echo "No Bicep files changed; nothing to compile."
            echo "compiled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${bicep_files[@]}"; do
            output_path=".ci/arm/${file%.bicep}.json"
            mkdir -p "$(dirname "$output_path")"
            az bicep build --file "$file" --outfile "$output_path"
          done

          echo "compiled=true" >> "$GITHUB_OUTPUT"
      
      # Bicep Linter runs automatically during build; errors will fail this step

      - name: Install PSRule for Azure
        if: steps.bicep.outputs.compiled == 'true'
        shell: pwsh
        run: |
          Install-Module -Name PSRule.Rules.Azure -Force -Scope CurrentUser

      - name: Run PSRule for Azure
        if: steps.bicep.outputs.compiled == 'true'
        shell: pwsh
        run: |
          Invoke-PSRule -InputPath ./.ci/arm -Module PSRule.Rules.Azure

      - name: Install ARM-TTK
        if: steps.bicep.outputs.compiled == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Azure/arm-ttk/archive/refs/heads/master.zip -OutFile arm-ttk.zip
          Expand-Archive arm-ttk.zip -DestinationPath .
      
      - name: Run ARM-TTK on generated ARM templates
        if: steps.bicep.outputs.compiled == 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.json' ./.ci/arm | ForEach-Object {
            pwsh ./arm-ttk-master/arm-ttk/arm-ttk.ps1 -Template $_.FullName
          }
