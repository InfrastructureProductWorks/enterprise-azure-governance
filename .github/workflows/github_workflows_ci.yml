name: Bicep CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bicep CLI
        run: |
          az bicep install

      - name: Lint Bicep Files & Build ARM Templates
        run: |
          mapfile -d '' bicep_files < <(find . -type f -name '*.bicep' -not -path './.git/*' -print0)
          if (( ${#bicep_files[@]} == 0 )); then
            echo "No Bicep files found"
            exit 1
          fi

          for file in "${bicep_files[@]}"; do
            relative_path="${file#./}"
            output_path=".ci/arm/${relative_path%.bicep}.json"
            mkdir -p "$(dirname "$output_path")"
            az bicep build --file "$file" --outfile "$output_path"
          done
      
      # Bicep Linter runs automatically during build; errors will fail this step

      - name: Install PSRule for Azure
        shell: pwsh
        run: |
          Install-Module -Name PSRule.Rules.Azure -Force -Scope CurrentUser

      - name: Run PSRule for Azure
        shell: pwsh
        run: |
          Invoke-PSRule -InputPath ./.ci/arm -Module PSRule.Rules.Azure

      - name: Install ARM-TTK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Azure/arm-ttk/archive/refs/heads/master.zip -OutFile arm-ttk.zip
          Expand-Archive arm-ttk.zip -DestinationPath .
      
      - name: Run ARM-TTK on generated ARM templates
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.json' ./.ci/arm | ForEach-Object {
            pwsh ./arm-ttk-master/arm-ttk/arm-ttk.ps1 -Template $_.FullName
          }
