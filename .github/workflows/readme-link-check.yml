name: Root README Link Check

on:
  pull_request:
    paths:
      - README.md
      - scripts/check_readme_links.py
      - .github/workflows/readme-link-check.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/check_readme_links.py
      - .github/workflows/readme-link-check.yml
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-readme-links:
    name: Root README links
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate root README links
        run: python3 scripts/check_readme_links.py README.md
